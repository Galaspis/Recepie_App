name: Deploy kort.gallab.top
# Push to main → the server rebuilds the container. Needs repo secrets VPS_SSH_KEY and VPS_HOST.
# App secrets live only in /srv/kort/kort.env on the server; data in /srv/kort/pg and /srv/kort/media.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the private network (Tailscale)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH setup
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync source
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: |
          rsync -az --delete --exclude .git --exclude node_modules --exclude '.env*' --exclude 'apps/server/public' \
            --exclude 'apps/server/media' --exclude 'apps/server/tmp' ./ deploy@$H:/srv/kort/src/
          scp -q deploy/docker-compose.yml deploy@$H:/srv/kort/compose.yml
      - name: Rebuild container
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: |
          ssh deploy@$H 'cd /srv/kort && test -f kort.env && test -f pg.env && touch cookies.txt \
            && (docker rm -f deploy-kort-1 >/dev/null 2>&1 || true) \
            && docker compose up -d --build 2>&1 | tail -3 && docker image prune -f >/dev/null'
      - name: Caddy site
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: |
          scp -q deploy/kort.caddy deploy@$H:/tmp/kort.caddy
          ssh deploy@$H 'sudo /usr/local/bin/caddy-site-install kort'
      - name: Smoke test
        env: { H: "${{ secrets.VPS_HOST }}" }
        run: |
          ssh deploy@$H 'sleep 10; curl -s -m 10 http://127.0.0.1:8787/health; echo; curl -s -o /dev/null -m 10 -w "api without identity: %{http_code}\n" http://127.0.0.1:8787/api/me; curl -s -m 10 -H "Remote-Email: ci-probe@example.com" -o /dev/null -w "api with unknown identity: %{http_code}\n" http://127.0.0.1:8787/api/me'
          code=$(curl -s -o /dev/null -m 15 -w "%{http_code}" https://kort.gallab.top/)
          echo "kort.gallab.top → $code (401 = login gate, expected)"
          test "$code" = "401"
